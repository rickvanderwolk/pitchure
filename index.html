<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitchure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            gap: 16px;
        }
        #start-overlay span {
            color: #fff;
            font-family: system-ui, sans-serif;
            font-size: 24px;
        }
        #start-overlay .subtitle {
            font-size: 14px;
            opacity: 0.5;
            max-width: 460px;
            text-align: center;
            line-height: 1.8;
        }
        #start-overlay.hidden {
            display: none;
        }
        #hud {
            position: fixed;
            bottom: 16px;
            left: 16px;
            z-index: 5;
            font-family: monospace;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            line-height: 1.6;
        }
        #cursor-indicator {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            transform: translate(-50%, -50%);
        }
        #cursor-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #cursor-indicator.drawing #cursor-dot {
            border-color: rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.3);
        }
        #cursor-indicator.navigating #cursor-dot {
            border-style: dashed;
            border-color: rgba(255, 255, 255, 0.5);
        }
        #direction-arrow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 2px;
            background: rgba(255, 255, 255, 0.25);
            transform-origin: 0 50%;
        }
        #color-preview {
            position: fixed;
            bottom: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="start-overlay">
        <span>Click to start</span>
        <span class="subtitle">
            <b>Pitch</b> (high/low) — steer left/right<br>
            <b>Volume</b> — silent = pause, soft = navigate, loud = draw<br>
            <b>Timbre</b> — "mmm" = red, "aaa" = green, "sss" = blue<br>
            <b>Clap</b> — 90° corner (low pitch before = left, high = right)
        </span>
    </div>
    <canvas id="canvas"></canvas>
    <div id="cursor-indicator">
        <div id="cursor-dot"></div>
        <div id="direction-arrow"></div>
    </div>
    <div id="color-preview"></div>
    <div id="hud"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const overlay = document.getElementById('start-overlay');
        const cursorEl = document.getElementById('cursor-indicator');
        const arrowEl = document.getElementById('direction-arrow');
        const colorPreview = document.getElementById('color-preview');
        const hudEl = document.getElementById('hud');

        let width, height;
        let audioContext, analyser, dataArray, freqArray;

        // Turtle state
        let penX, penY;
        let prevX, prevY;
        let currentAngle = 0;
        let isDrawing = false;
        let isNavigating = false;
        let silenceFrames = 0;

        // Pitch detection
        const MIN_FREQ = 80;
        const MAX_FREQ = 1000;

        // Volume
        let peakVolume = 0.1;
        const SILENCE_THRESHOLD = 0.03;
        const DRAW_THRESHOLD = 0.35;

        // Onset detection (claps)
        let energyHistory = [];
        const ENERGY_HISTORY_SIZE = 30;
        let onsetCooldown = 0;

        // Spectral centroid tracking
        let peakCentroid = 3000;
        let minCentroid = 200;

        // Last known pitch for clap direction
        let lastPitchNormalized = 0.5;

        // Current color
        let currentHue = 0;
        let currentSat = 70;
        let currentLight = 55;

        function resize() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            ctx.putImageData(imageData, 0, 0);
        }

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            penX = width / 2;
            penY = height / 2;
            prevX = penX;
            prevY = penY;
        }

        init();
        window.addEventListener('resize', resize);

        // --- Audio analysis ---

        function getVolume() {
            analyser.getByteTimeDomainData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                const val = (dataArray[i] - 128) / 128;
                sum += val * val;
            }
            const rms = Math.sqrt(sum / dataArray.length);

            if (rms > peakVolume) {
                peakVolume = rms;
            } else {
                peakVolume = Math.max(0.05, peakVolume - 0.0008);
            }

            return Math.min(1, rms / peakVolume);
        }

        function detectOnset(volume) {
            energyHistory.push(volume);
            if (energyHistory.length > ENERGY_HISTORY_SIZE) energyHistory.shift();

            if (onsetCooldown > 0) {
                onsetCooldown--;
                return false;
            }

            const avg = energyHistory.reduce((a, b) => a + b, 0) / energyHistory.length;
            if (volume > avg * 2.5 && volume > 0.4) {
                onsetCooldown = 20;
                return true;
            }
            return false;
        }

        function detectPitch() {
            analyser.getByteTimeDomainData(dataArray);
            const bufLen = dataArray.length;
            const sampleRate = audioContext.sampleRate;

            const float = new Float32Array(bufLen);
            for (let i = 0; i < bufLen; i++) {
                float[i] = (dataArray[i] - 128) / 128;
            }

            let start = 0;
            for (let i = 0; i < bufLen / 2; i++) {
                if (float[i] < 0 && float[i + 1] >= 0) {
                    start = i;
                    break;
                }
            }

            const minLag = Math.floor(sampleRate / MAX_FREQ);
            const maxLag = Math.floor(sampleRate / MIN_FREQ);
            let bestCorr = 0;
            let bestLag = minLag;

            for (let lag = minLag; lag < maxLag && lag < bufLen / 2; lag++) {
                let corr = 0;
                let norm1 = 0;
                let norm2 = 0;
                const len = bufLen / 2 - lag;
                for (let i = start; i < start + len; i++) {
                    corr += float[i] * float[i + lag];
                    norm1 += float[i] * float[i];
                    norm2 += float[i + lag] * float[i + lag];
                }
                const norm = Math.sqrt(norm1 * norm2);
                if (norm > 0) corr /= norm;

                if (corr > bestCorr) {
                    bestCorr = corr;
                    bestLag = lag;
                }
            }

            if (bestCorr < 0.3) return null;

            const freq = sampleRate / bestLag;
            if (freq < MIN_FREQ || freq > MAX_FREQ) return null;
            return freq;
        }

        // Spectral centroid — center of mass of the frequency spectrum
        // Low centroid = dark/warm sound (mmm, humming) → red/orange
        // Mid centroid = open sound (aaa, singing) → green/yellow
        // High centroid = bright/sharp sound (sss, shh) → blue/purple
        function getSpectralCentroid() {
            analyser.getByteFrequencyData(freqArray);
            const sampleRate = audioContext.sampleRate;
            const binWidth = sampleRate / analyser.fftSize;

            let weightedSum = 0;
            let totalEnergy = 0;

            for (let i = 1; i < freqArray.length; i++) {
                const energy = freqArray[i];
                const freq = i * binWidth;
                weightedSum += freq * energy;
                totalEnergy += energy;
            }

            if (totalEnergy < 1) return null;

            const centroid = weightedSum / totalEnergy;

            // Adapt range over time
            if (centroid > peakCentroid) {
                peakCentroid = centroid;
            } else {
                peakCentroid = Math.max(2000, peakCentroid - 1);
            }
            if (centroid < minCentroid) {
                minCentroid = centroid;
            } else {
                minCentroid = Math.min(500, minCentroid + 0.5);
            }

            return centroid;
        }

        // Map spectral centroid to hue
        function centroidToHue(centroid) {
            if (centroid === null) return currentHue;

            // Normalize centroid to 0-1
            const normalized = Math.max(0, Math.min(1,
                (centroid - minCentroid) / (peakCentroid - minCentroid)
            ));

            // Map to hue: 0 (red) → 120 (green) → 240 (blue)
            // Low centroid (dark sounds) = warm (0-60, red/orange)
            // Mid centroid (open sounds) = mid (60-180, yellow/green)
            // High centroid (bright sounds) = cool (180-280, blue/purple)
            return normalized * 280;
        }

        // Spectral spread — how "wide" the sound is
        // Pure tone (whistle) = narrow = thin line
        // Rich sound (voice) = medium
        // Noise (shh) = wide = thick line modifier
        function getSpectralSpread(centroid) {
            if (centroid === null) return 0.5;

            analyser.getByteFrequencyData(freqArray);
            const sampleRate = audioContext.sampleRate;
            const binWidth = sampleRate / analyser.fftSize;

            let spreadSum = 0;
            let totalEnergy = 0;

            for (let i = 1; i < freqArray.length; i++) {
                const energy = freqArray[i];
                const freq = i * binWidth;
                const diff = freq - centroid;
                spreadSum += diff * diff * energy;
                totalEnergy += energy;
            }

            if (totalEnergy < 1) return 0.5;

            const spread = Math.sqrt(spreadSum / totalEnergy);
            // Normalize roughly: whistle ~100-300, voice ~500-1500, noise ~2000+
            return Math.min(1, spread / 2000);
        }

        // --- Drawing ---

        function draw() {
            if (!analyser) {
                requestAnimationFrame(draw);
                return;
            }

            const volume = getVolume();
            const pitch = detectPitch();
            const isOnset = detectOnset(volume);
            const centroid = getSpectralCentroid();
            const spread = getSpectralSpread(centroid);
            const hasSound = volume > SILENCE_THRESHOLD;
            const isLoud = volume > DRAW_THRESHOLD;

            if (hasSound) {
                // --- Clap: sharp 90° turn ---
                // Direction based on last pitch: low = left, high = right
                if (isOnset) {
                    const dir = lastPitchNormalized < 0.5 ? -1 : 1;
                    currentAngle += (Math.PI / 2) * dir;
                }

                // --- Pitch → steering ---
                if (pitch !== null && !isOnset) {
                    const logMin = Math.log2(MIN_FREQ);
                    const logMax = Math.log2(MAX_FREQ);
                    const logPitch = Math.log2(pitch);
                    const normalized = (logPitch - logMin) / (logMax - logMin);
                    lastPitchNormalized = normalized;

                    const deadZone = 0.15;
                    const center = 0.5;
                    const maxTurnRate = 0.07;

                    if (normalized < center - deadZone) {
                        const strength = (center - deadZone - normalized) / (center - deadZone);
                        currentAngle -= maxTurnRate * strength;
                    } else if (normalized > center + deadZone) {
                        const strength = (normalized - center - deadZone) / (1 - center - deadZone);
                        currentAngle += maxTurnRate * strength;
                    }
                }

                // --- Color from timbre ---
                const targetHue = centroidToHue(centroid);
                currentHue += (targetHue - currentHue) * 0.1; // Smooth transition
                currentSat = 60 + spread * 30; // Noisier = more saturated
                currentLight = 40 + volume * 30;

                // --- Movement ---
                const speed = isLoud ? (2 + volume * 8) : (1 + volume * 4);

                const newX = penX + Math.cos(currentAngle) * speed;
                const newY = penY + Math.sin(currentAngle) * speed;

                penX = ((newX % width) + width) % width;
                penY = ((newY % height) + height) % height;

                const dx = penX - prevX;
                const dy = penY - prevY;
                const wrapped = Math.abs(dx) > width / 2 || Math.abs(dy) > height / 2;

                // --- Draw when loud ---
                if (isLoud && !wrapped) {
                    // Line width: base from volume, modified by spread
                    // Pure tone (whistle) = thin, noise = thick
                    const baseWidth = 1.5 + volume * 4;
                    const spreadBonus = spread * 4;
                    const lineWidth = baseWidth + spreadBonus;

                    ctx.beginPath();
                    ctx.moveTo(prevX, prevY);
                    ctx.lineTo(penX, penY);
                    ctx.strokeStyle = `hsl(${currentHue}, ${currentSat}%, ${currentLight}%)`;
                    ctx.lineWidth = lineWidth;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    isDrawing = true;
                    isNavigating = false;
                } else {
                    isDrawing = false;
                    isNavigating = true;
                }

                prevX = penX;
                prevY = penY;
                silenceFrames = 0;

            } else {
                isDrawing = false;
                isNavigating = false;
                silenceFrames++;
                prevX = penX;
                prevY = penY;
            }

            // --- Update UI ---
            cursorEl.style.left = penX + 'px';
            cursorEl.style.top = penY + 'px';
            cursorEl.classList.toggle('drawing', isDrawing);
            cursorEl.classList.toggle('navigating', isNavigating);
            arrowEl.style.transform = `rotate(${currentAngle}rad)`;

            // Color preview
            const previewColor = `hsl(${currentHue}, ${currentSat}%, ${currentLight}%)`;
            colorPreview.style.background = hasSound ? previewColor : 'transparent';
            colorPreview.style.borderColor = hasSound ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.1)';

            // HUD
            const mode = isDrawing ? 'DRAW' : isNavigating ? 'NAV' : 'PAUSE';
            hudEl.textContent = mode;

            requestAnimationFrame(draw);
        }

        // --- Start ---

        async function start() {
            overlay.classList.add('hidden');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 4096;
                analyser.smoothingTimeConstant = 0.4;

                dataArray = new Uint8Array(analyser.fftSize);
                freqArray = new Uint8Array(analyser.frequencyBinCount);

                source.connect(analyser);

                draw();
            } catch (err) {
                console.error('Microphone access denied:', err);
                overlay.innerHTML = '<span>Microphone access required</span>';
                overlay.classList.remove('hidden');
            }
        }

        overlay.addEventListener('click', start);
    </script>
</body>
</html>
